# Engines for the alias-acceptance e2e. mariadb/tidb route to the mysql
# driver (mysql server), postgresql to postgres, opensearch to the ES
# driver (the Elasticsearch container is wire-compatible for the basic
# index ops treeman uses). Distinct ports so the suite runs concurrently.
services:
  mysql:
    image: mysql:8.4
    container_name: treeman-e2e-alias-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
    ports:
      - "13343:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  postgres:
    image: postgres:16-alpine
    container_name: treeman-e2e-alias-postgres
    environment:
      POSTGRES_PASSWORD: pgpw
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: treeman-e2e-alias-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "19201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"\\(green\\|yellow\\)\"'"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
