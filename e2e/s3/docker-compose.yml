services:
  minio:
    image: minio/minio:latest
    container_name: treeman-e2e-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Garage is the second S3-compatible backend the driver must support.
  # It speaks the S3 API with path-style addressing and a fixed region,
  # so it exercises the same code path as MinIO but on an independent
  # implementation. The node needs layout + a key provisioned after
  # boot — the test does that via `docker exec /garage ...` (see
  # provisionGarage in s3_test.go), because the image is shell-less and
  # a one-shot init service would trip `compose up --wait`.
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: treeman-e2e-garage
    entrypoint: /garage
    command: ["-c", "/etc/garage.toml", "server"]
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    ports:
      - "19010:3900"
    healthcheck:
      # /garage is the only binary in the image (no shell, no curl), so
      # health is the S3 API accepting a TCP connection — `node id`
      # succeeds once the server is listening.
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "node", "id", "-q"]
      interval: 2s
      timeout: 3s
      retries: 30
