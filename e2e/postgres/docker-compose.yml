services:
  postgres:
    image: postgres:16-alpine
    container_name: treeman-e2e-postgres
    environment:
      POSTGRES_PASSWORD: pgpw
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
