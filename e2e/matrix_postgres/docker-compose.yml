# Postgres for the per-engine option matrix (compose_service,
# test_clones:auto, password $ENV ref, pool_max). Auth required (pgpw)
# so the password-ref test is meaningful. Distinct port.
services:
  postgres:
    image: postgres:16-alpine
    container_name: treeman-e2e-mxpg
    environment:
      POSTGRES_PASSWORD: pgpw
    ports:
      - "15440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
