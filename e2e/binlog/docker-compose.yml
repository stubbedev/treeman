services:
  mysql:
    image: mysql:8.4
    container_name: treeman-e2e-binlog-mysql
    environment: { MYSQL_ROOT_PASSWORD: rootpw }
    ports: ["13446:3306"]
    command:
      - --log-bin=binlog
      - --binlog-format=ROW
      - --server-id=1
      - --binlog-row-metadata=FULL
      - --binlog-row-image=FULL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
