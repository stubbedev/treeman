services:
  postgres:
    image: postgres:16-alpine
    container_name: treeman-e2e-fw-django-pg
    environment: { POSTGRES_PASSWORD: pgpw }
    ports: ["15462:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  django:
    image: python:3.12-slim
    container_name: treeman-e2e-fw-django-py
    command: ["sh", "-c", "pip install --quiet django psycopg2-binary && sleep infinity"]
    volumes:
      - /tmp:/tmp
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import django, psycopg2'"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
