services:
  mysql:
    image: mysql:8.4
    container_name: treeman-e2e-bs-mysql
    environment: { MYSQL_ROOT_PASSWORD: rootpw }
    ports: ["13390:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  redis:
    image: redis:7-alpine
    container_name: treeman-e2e-bs-redis
    ports: ["16390:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:16-alpine
    container_name: treeman-e2e-bs-postgres
    environment: { POSTGRES_PASSWORD: pgpw }
    ports: ["15490:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
  mongo:
    image: mongo:7
    container_name: treeman-e2e-bs-mongo
    ports: ["27190:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping: 1}).ok"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: treeman-e2e-bs-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["19290:9200"]
