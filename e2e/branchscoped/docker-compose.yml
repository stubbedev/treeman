services:
  mysql:
    image: mysql:8.4
    container_name: treeman-e2e-bs-mysql
    environment: { MYSQL_ROOT_PASSWORD: rootpw }
    ports: ["13390:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  redis:
    image: redis:7-alpine
    container_name: treeman-e2e-bs-redis
    ports: ["16390:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
