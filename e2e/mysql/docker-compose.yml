# MySQL e2e fixture. Port 13306 is outside common conflicts so a
# developer's local mysqld on 3306 doesn't block the test run.
services:
  mysql:
    image: mysql:8.4
    container_name: treeman-e2e-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
    ports:
      - "13306:3306"
    command:
      - --log-bin=binlog
      - --server-id=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
