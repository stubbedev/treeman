services:
  mongo:
    image: mongo:7
    container_name: treeman-e2e-mongodump
    ports: ["27127:27017"]
    volumes:
      - /tmp:/tmp
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
