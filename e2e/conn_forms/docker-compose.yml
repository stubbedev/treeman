# Engines for the bare-scalar connection-form e2e. Distinct ports so the
# suite runs concurrently with the rest.
services:
  mysql:
    image: mysql:8.4
    container_name: treeman-e2e-connforms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
    ports:
      - "13344:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  postgres:
    image: postgres:16-alpine
    container_name: treeman-e2e-connforms-postgres
    environment:
      POSTGRES_PASSWORD: pgpw
    ports:
      - "15434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
  redis:
    image: redis:7-alpine
    container_name: treeman-e2e-connforms-redis
    ports:
      - "16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
  mongo:
    image: mongo:7
    container_name: treeman-e2e-connforms-mongo
    ports:
      - "27027:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: treeman-e2e-connforms-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9244:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s
