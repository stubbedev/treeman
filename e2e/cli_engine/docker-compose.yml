# MySQL for the engine-backed CLI command e2e (`treeman prepare`,
# `treeman db reset|status` — all run inline, no daemon needed).
services:
  mysql:
    image: mysql:8.4
    container_name: treeman-e2e-cliengine-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
    ports:
      - "13360:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
