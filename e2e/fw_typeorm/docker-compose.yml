services:
  postgres:
    image: postgres:16-alpine
    container_name: treeman-e2e-fw-typeorm-pg
    environment: { POSTGRES_PASSWORD: pgpw }
    ports: ["15492:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  node:
    image: node:20
    container_name: treeman-e2e-fw-typeorm-node
    command: ["sleep", "infinity"]
    volumes:
      - /tmp:/tmp
    depends_on:
      postgres:
        condition: service_healthy
