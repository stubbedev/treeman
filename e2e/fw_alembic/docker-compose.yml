services:
  postgres:
    image: postgres:16-alpine
    container_name: treeman-e2e-fw-alembic-pg
    environment: { POSTGRES_PASSWORD: pgpw }
    ports: ["15472:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  alembic:
    image: python:3.12-slim
    container_name: treeman-e2e-fw-alembic-py
    command: ["sh", "-c", "pip install --quiet alembic psycopg2-binary sqlalchemy && sleep infinity"]
    volumes:
      - /tmp:/tmp
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import alembic, psycopg2'"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
