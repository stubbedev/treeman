[package]
name = "treeman-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "treemand — Treeman daemon."

[[bin]]
name = "treemand"
path = "src/main.rs"

[dependencies]
treeman-proto = { workspace = true }
treeman-core = { workspace = true }
treeman-store = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
treeman-watcher = { workspace = true }
treeman-migrations = { workspace = true }
libc = "0.2"
treeman-prepare = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
