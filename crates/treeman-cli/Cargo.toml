[package]
name = "treeman-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "treeman — CLI client for treemand."

[[bin]]
name = "treeman"
path = "src/main.rs"

[dependencies]
treeman-proto = { workspace = true }
treeman-core = { workspace = true }
treeman-store = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
jsonrpsee = { workspace = true, features = ["client", "http-client"] }
directories = { workspace = true }
