[package]
name = "treeman-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "treeman — CLI client for treemand."

[[bin]]
name = "treeman"
path = "src/main.rs"

[dependencies]
treeman-proto = { workspace = true }
treeman-core = { workspace = true }
treeman-store = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
treeman-db = { workspace = true }
treeman-migrations = { workspace = true }
treeman-watcher = { workspace = true }
treeman-snapshot = { workspace = true }
treeman-prepare = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
clap_mangen = "0.2"
owo-colors = "4"
is-terminal = "0.4"
directories = { workspace = true }
