[package]
name = "treeman-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Treeman pure-wire DB drivers (mysql, redis; pg/mongo/es follow)."

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["mysql", "postgres", "runtime-tokio-rustls", "macros"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "tokio-rustls-comp"] }
mongodb = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
mysql_async = { version = "0.34", default-features = false, features = ["minimal-rust", "binlog"] }
base64 = "0.22"
tokio = { workspace = true }
tracing = { workspace = true }
treeman-core = { workspace = true }

[features]
default = []
# Live integration tests. By preference the tests use connection URLs
# from env vars (`TREEMAN_TEST_MYSQL_URL`, `TREEMAN_TEST_POSTGRES_URL`,
# `TREEMAN_TEST_REDIS_URL`) so they can run against the developer's
# already-running infra; when those are unset, the tests fall back to
# `testcontainers` so CI (without pre-provisioned databases) works
# out of the box. Either way, each test scopes itself to a unique
# `tm_it_<hash>_*` namespace.
#
# Run with:
#   cargo test --features integration -p treeman-db -- --include-ignored
integration = ["dep:testcontainers-modules"]

[dependencies.testcontainers-modules]
version = "0.13"
optional = true
features = ["mysql", "postgres", "redis"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
blake3 = "1"
