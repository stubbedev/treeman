[package]
name = "treeman-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Treeman pure-wire DB drivers (mysql, redis; pg/mongo/es follow)."

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["mysql", "postgres", "runtime-tokio-rustls", "macros"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "tokio-rustls-comp"] }
mongodb = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
mysql_async = { version = "0.34", default-features = false, features = ["minimal-rust", "binlog"] }
base64 = "0.22"
tokio = { workspace = true }
tracing = { workspace = true }
treeman-core = { workspace = true }

[features]
default = []
# Live integration tests against the developer's already-running
# infra. Each test reads its connection URL from an env var
# (`TREEMAN_TEST_MYSQL_URL`, `TREEMAN_TEST_POSTGRES_URL`,
# `TREEMAN_TEST_REDIS_URL`) and scopes itself to a uniquely-named
# database so it never collides with any other tenant on that host.
# Tests that don't find their env var are skipped.
#
# Run with:
#   cargo test --features integration -p treeman-db -- --include-ignored
integration = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
blake3 = "1"
