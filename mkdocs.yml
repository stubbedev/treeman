site_name: treeman
site_description: Isolated databases for every git worktree.
site_url: https://stubbedev.github.io/treeman/
repo_url: https://github.com/stubbedev/treeman
repo_name: stubbedev/treeman
edit_uri: edit/master/docs/
copyright: Dual-licensed under Apache-2.0 or MIT

strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
      - Concepts: concepts.md
      - Configuration: configuration.md
      - Git workflow: git-workflow.md
      - Snapshots & frameworks: snapshots.md
      - CI without a daemon: ci.md
      - Composer install: composer.md
      - AI integration (MCP): mcp.md
      - Internals: internals.md
  - Reference:
      - CLI: cli.md
      - Config keys: config-reference.md
      - MCP tools: mcp-tools.md
      - Events: events.md
      - Framework presets: frameworks.md
      - RPC: rpc-reference.md
