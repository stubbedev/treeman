version: "2"

# Focused lint config for error-handling hygiene:
#   - errcheck:    every returned error is handled. Deliberate discards
#                  are written `_ = expr` so intent stays visible.
#   - errorlint:   errors are wrapped (%w) and matched with errors.Is /
#                  errors.As, not == / != / bare type assertions, so the
#                  checks survive a wrapped error.
#   - ineffassign: no dead stores (assignments overwritten before use).
# Scoped deliberately: errcheck type-assertion and blank checks are off,
# and the other default linters stay disabled so this config does one job.
linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - ineffassign
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false

issues:
  # Report every finding, not golangci-lint's default capped subset,
  # so a regression can't hide behind the per-linter / per-message cap.
  max-issues-per-linter: 0
  max-same-issues: 0
