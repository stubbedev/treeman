name: ci

on:
  push:
    branches: [main, master, go-rewrite]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: go build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          out=$(gofmt -l ./cmd ./internal)
          if [ -n "$out" ]; then
            echo "::error::gofmt would rewrite the following files:"
            printf '%s\n' "$out"
            echo
            echo "--- proposed diff ---"
            gofmt -d ./cmd ./internal
            exit 1
          fi
      - run: go test ./...

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # need a real ref + write token so the auto-bump step can
          # push the refreshed vendorHash back to master.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # Inline `just sync-flake`. Rewrites flake.nix's vendorHash to
      # match the current go.sum. On master pushes the result is
      # auto-committed (next step); on PRs we fail if it would
      # change anything, so reviewers see the drift instead of CI
      # silently masking it.
      - name: sync flake.nix vendorHash
        run: |
          set -euo pipefail
          GO_SUM_HASH=$(sha256sum go.sum | awk '{print $1}')
          SENTINEL="sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          sed -i -E 's|^(\s*vendorHash = )"sha256-[^"]*";|\1"'"$SENTINEL"'";|' flake.nix
          set +e
          OUT=$(nix build .#treeman --no-link 2>&1)
          BUILD_STATUS=$?
          set -e
          NEW_HASH=$(printf '%s\n' "$OUT" | awk '/got:[[:space:]]*sha256-/ {print $2; exit}')
          if [ -z "$NEW_HASH" ]; then
            if [ "$BUILD_STATUS" = "0" ]; then
              echo "::error::sync-flake: nix build unexpectedly succeeded with sentinel hash"
              echo "$OUT"
              exit 1
            fi
            echo "$OUT"
            echo "::error::sync-flake: nix build did not print 'got: sha256-…'"
            exit 1
          fi
          sed -i -E 's|^(\s*vendorHash = )"sha256-[^"]*";|\1"'"$NEW_HASH"'";|' flake.nix
          if grep -q '^[[:space:]]*# go-sum:' flake.nix; then
            sed -i -E 's|^(\s*# go-sum:).*|\1 '"$GO_SUM_HASH"'|' flake.nix
          else
            sed -i -E 's|^(\s*vendorHash = )|          # go-sum: '"$GO_SUM_HASH"'\n\1|' flake.nix
          fi
          echo "sync-flake: vendorHash=$NEW_HASH go-sum=$GO_SUM_HASH"

      - name: assert flake.nix in sync (PR)
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain flake.nix)" ]; then
            echo "::error::flake.nix vendorHash is out of sync with go.sum. Run 'just sync-flake' locally and commit the result."
            git --no-pager diff flake.nix
            exit 1
          fi

      - name: auto-commit flake.nix bump (master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if [ -z "$(git status --porcelain flake.nix)" ]; then
            echo "flake.nix already in sync; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flake.nix
          git commit -m 'chore: auto-bump flake.nix vendorHash [skip ci]'
          git push origin HEAD:master

      - run: nix flake check --print-build-logs

  schema:
    name: regenerate JSON schema
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Need a writable ref + token for the master auto-commit
          # step below.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Regenerate `schemas/treeman.schema.json` from the current
      # config.Config Go types. On master pushes drift is auto-
      # committed; on PRs we fail so reviewers see the drift.
      - name: regenerate treeman.schema.json
        run: |
          set -euo pipefail
          mkdir -p schemas
          go run ./cmd/treeman schema dump --out schemas/treeman.schema.json

      - name: assert schema in sync (PR)
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain schemas/treeman.schema.json)" ]; then
            echo "::error::schemas/treeman.schema.json is stale. Run 'just sync-schema' locally and commit the result."
            git --no-pager diff schemas/treeman.schema.json
            exit 1
          fi

      - name: auto-commit schema bump (master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if [ -z "$(git status --porcelain schemas/treeman.schema.json)" ]; then
            echo "schemas/treeman.schema.json already in sync; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schemas/treeman.schema.json
          git commit -m 'chore: auto-bump treeman.schema.json [skip ci]'
          git push origin HEAD:master

  docs:
    name: regenerate generated docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Need a writable ref + token for the master auto-commit
          # step below.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Regenerate the generated docs from the live binary: `docs/cli.md`
      # from the cli.Command tree and `docs/config-reference.md` from the
      # config.Config types. On master pushes drift is auto-committed; on
      # PRs we fail so reviewers see the drift. Mirrors the schema job.
      - name: regenerate generated docs
        run: |
          set -euo pipefail
          mkdir -p docs
          go run ./cmd/treeman-gen-docs docs/cli.md
          go run ./cmd/treeman-gen-config-docs docs/config-reference.md

      - name: assert docs in sync (PR)
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain docs/cli.md docs/config-reference.md)" ]; then
            echo "::error::generated docs are stale. Run 'just sync-docs' locally and commit the result."
            git --no-pager diff docs/cli.md docs/config-reference.md
            exit 1
          fi

      - name: auto-commit docs bump (master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if [ -z "$(git status --porcelain docs/cli.md docs/config-reference.md)" ]; then
            echo "generated docs already in sync; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cli.md docs/config-reference.md
          git commit -m 'chore: auto-bump generated docs [skip ci]'
          git push origin HEAD:master
