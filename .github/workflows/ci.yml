name: ci

on:
  push:
    branches: [main, master, go-rewrite]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: go build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # e2e suites are behind //go:build e2e, so the untagged vet above
      # never type-checks them — a signature change in internal/daemon
      # kept CI green and only broke the release e2e run. Tagged vet is a
      # compile-only gate (no docker, no containers).
      - run: go vet -tags e2e ./...
      - run: go test ./...

  # Container-free e2e on every push/PR. The full e2e matrix (engines,
  # frameworks, …) needs Docker and only runs on release tags; the `lite`
  # batch (cli_surface, logs, notifications) exercises the CLI / daemon /
  # event surface with no engine, so it catches event/hook/status-name
  # drift here instead of at release. Engine tests gate on
  # harness.SkipIfNoDocker, so even if a docker test sneaks into the batch
  # it skips rather than fails.
  e2e-lite:
    name: e2e (container-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v4
      - name: run container-free e2e batch
        run: just test-e2e lite

  # Runs the flake-pinned golangci-lint (devShells.ci) instead of a
  # second version pinned in this file. flake.lock is the only pin, so a
  # nixpkgs bump moves CI and the dev shell together — the previous split
  # left CI a minor behind and turned a renamed linter into 1481
  # local-only findings that blocked `just release-*`. This job is exactly:
  #   nix develop .#ci --command golangci-lint run ./...
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Substitute from the self-hosted xilo cache. This must be set at
          # install time: the `xilo use` step later in the job rewrites nix.conf
          # only after the build has already run, so the cache was previously
          # written to but never read from.
          extra-conf: |
            extra-substituters = https://nix.stubbe.dev/c/default/default
            extra-trusted-public-keys = default:6uWvXutL9cXjV3lii+Ur5ff+ArQoG4kMBKNXWrIxhHg=
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-lint-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
          restore-prefixes-first-match: nix-lint-${{ runner.os }}-
      - run: nix develop .#ci --command golangci-lint version
      # Rejects a config that references a renamed/removed linter or a
      # setting the current version no longer knows.
      - run: nix develop .#ci --command golangci-lint config verify
      # The real format gate: gofumpt + goimports + golines, the same
      # stack `just fmt` applies. `gofmt -l` only knew about plain gofmt,
      # so drift in the other three reached master untouched. Exits
      # non-zero when a rewrite is pending.
      - run: nix develop .#ci --command golangci-lint fmt --diff
      - run: nix develop .#ci --command golangci-lint run ./...

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # need a real ref + write token so the auto-bump step can
          # push the refreshed vendorHash back to master.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Substitute from the self-hosted xilo cache. This must be set at
          # install time: the `xilo use` step later in the job rewrites nix.conf
          # only after the build has already run, so the cache was previously
          # written to but never read from.
          extra-conf: |
            extra-substituters = https://nix.stubbe.dev/c/default/default
            extra-trusted-public-keys = default:6uWvXutL9cXjV3lii+Ur5ff+ArQoG4kMBKNXWrIxhHg=
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock', '**/Cargo.lock', '**/go.sum') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
          gc-max-store-size-linux: 5G

      # Inline `just sync-flake`. Rewrites flake.nix's vendorHash to
      # match the current go.sum. On master pushes the result is
      # auto-committed (next step); on PRs we fail if it would
      # change anything, so reviewers see the drift instead of CI
      # silently masking it.
      - name: sync flake.nix vendorHash
        run: |
          set -euo pipefail
          GO_SUM_HASH=$(sha256sum go.sum | awk '{print $1}')
          SENTINEL="sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          sed -i -E 's|^(\s*vendorHash = )"sha256-[^"]*";|\1"'"$SENTINEL"'";|' flake.nix
          set +e
          OUT=$(nix build .#treeman --no-link 2>&1)
          BUILD_STATUS=$?
          set -e
          NEW_HASH=$(printf '%s\n' "$OUT" | awk '/got:[[:space:]]*sha256-/ {print $2; exit}')
          if [ -z "$NEW_HASH" ]; then
            if [ "$BUILD_STATUS" = "0" ]; then
              echo "::error::sync-flake: nix build unexpectedly succeeded with sentinel hash"
              echo "$OUT"
              exit 1
            fi
            echo "$OUT"
            echo "::error::sync-flake: nix build did not print 'got: sha256-…'"
            exit 1
          fi
          sed -i -E 's|^(\s*vendorHash = )"sha256-[^"]*";|\1"'"$NEW_HASH"'";|' flake.nix
          if grep -q '^[[:space:]]*# go-sum:' flake.nix; then
            sed -i -E 's|^(\s*# go-sum:).*|\1 '"$GO_SUM_HASH"'|' flake.nix
          else
            sed -i -E 's|^(\s*vendorHash = )|          # go-sum: '"$GO_SUM_HASH"'\n\1|' flake.nix
          fi
          echo "sync-flake: vendorHash=$NEW_HASH go-sum=$GO_SUM_HASH"

      - name: assert flake.nix in sync (PR)
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain flake.nix)" ]; then
            echo "::error::flake.nix vendorHash is out of sync with go.sum. Run 'just sync-flake' locally and commit the result."
            git --no-pager diff flake.nix
            exit 1
          fi

      - name: auto-commit flake.nix bump (master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if [ -z "$(git status --porcelain flake.nix)" ]; then
            echo "flake.nix already in sync; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flake.nix
          git commit -m 'chore: auto-bump flake.nix vendorHash [skip ci]'
          git push origin HEAD:master

      - run: nix flake check --print-build-logs

      # Push the built package closure to the self-hosted xilo cache on master
      # pushes, so `nix run`/flake consumers tracking HEAD pull a prebuilt
      # binary instead of recompiling. Release tags push the same way from
      # release.yml's `cache` job. A failed push is not swallowed: it would
      # leave every consumer rebuilding from source, so the step fails the
      # job.
      - name: setup xilo
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: stubbedev/xilo@v1
        with:
          url: https://nix.stubbe.dev
          cache: default
          token: ${{ secrets.XILO_TOKEN }}

      - name: push nix build to xilo (master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          OUT=$(nix build .#treeman --no-link --print-out-paths)
          xilo push default $OUT

  schema:
    name: regenerate JSON schema
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Need a writable ref + token for the master auto-commit
          # step below.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Regenerate the published JSON schemas from the current
      # config.Config Go types. Two scoped schemas are published:
      #   treeman.schema.json        — repo scope, validates .treeman.yaml
      #   treeman.global.schema.json — global scope, validates the
      #                                user-global config.yaml
      # On master pushes drift is auto-committed; on PRs we fail so
      # reviewers see the drift.
      - name: regenerate JSON schemas
        run: |
          set -euo pipefail
          mkdir -p schemas
          go run ./cmd/treeman schema dump --scope repo   --out schemas/treeman.schema.json
          go run ./cmd/treeman schema dump --scope global --out schemas/treeman.global.schema.json

      - name: assert schemas in sync (PR)
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain schemas/treeman.schema.json schemas/treeman.global.schema.json)" ]; then
            echo "::error::JSON schemas are stale. Run 'just sync-schema' locally and commit the result."
            git --no-pager diff schemas/treeman.schema.json schemas/treeman.global.schema.json
            exit 1
          fi

      - name: auto-commit schema bump (master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if [ -z "$(git status --porcelain schemas/treeman.schema.json schemas/treeman.global.schema.json)" ]; then
            echo "schemas already in sync; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schemas/treeman.schema.json schemas/treeman.global.schema.json
          git commit -m 'chore: auto-bump JSON schemas [skip ci]'
          git push origin HEAD:master

  docs:
    name: regenerate generated docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Need a writable ref + token for the master auto-commit
          # step below.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Regenerate the generated docs from the live binary + registries:
      # cli.md (cli.Command tree), config-reference.md (config.Config),
      # mcp-tools.md (mcp.Catalog), events.md (store.Evt* consts). On
      # master pushes drift is auto-committed; on PRs we fail so reviewers
      # see the drift. Mirrors the schema job.
      - name: regenerate generated docs
        run: |
          set -euo pipefail
          mkdir -p docs
          go run ./cmd/treeman-gen-docs docs/cli.md
          go run ./cmd/treeman-gen-config-docs docs/config-reference.md
          go run ./cmd/treeman-gen-mcp-docs docs/mcp-tools.md
          go run ./cmd/treeman-gen-events-docs docs/events.md
          go run ./cmd/treeman-gen-frameworks-docs docs/frameworks.md
          go run ./cmd/treeman-gen-rpc-docs docs/rpc-reference.md

      - name: assert docs in sync (PR)
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain docs/cli.md docs/config-reference.md docs/mcp-tools.md docs/events.md docs/frameworks.md docs/rpc-reference.md)" ]; then
            echo "::error::generated docs are stale. Run 'just sync-docs' locally and commit the result."
            git --no-pager diff docs/cli.md docs/config-reference.md docs/mcp-tools.md docs/events.md docs/frameworks.md docs/rpc-reference.md
            exit 1
          fi

      - name: auto-commit docs bump (master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if [ -z "$(git status --porcelain docs/cli.md docs/config-reference.md docs/mcp-tools.md docs/events.md docs/frameworks.md docs/rpc-reference.md)" ]; then
            echo "generated docs already in sync; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cli.md docs/config-reference.md docs/mcp-tools.md docs/events.md docs/frameworks.md docs/rpc-reference.md
          git commit -m 'chore: auto-bump generated docs [skip ci]'
          git push origin HEAD:master
