name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            os: ubuntu-latest
          - goos: linux
            goarch: arm64
            os: ubuntu-latest
          - goos: darwin
            goarch: amd64
            os: macos-latest
          - goos: darwin
            goarch: arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="treeman-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "dist/$STAGE"
          export CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
          go build -trimpath \
            -ldflags="-s -w -X github.com/stubbedev/treeman/internal/version.Version=${VERSION}" \
            -o "dist/$STAGE/treeman"  ./cmd/treeman
          go build -trimpath \
            -ldflags="-s -w -X github.com/stubbedev/treeman/internal/version.Version=${VERSION}" \
            -o "dist/$STAGE/treemand" ./cmd/treemand
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$STAGE/" 2>/dev/null || true
          cd dist
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/treeman-*.tar.gz*
          retention-days: 7

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  bump-tap:
    name: bump homebrew tap
    needs: release
    runs-on: ubuntu-latest
    # Skip prereleases — only stable tags update the tap formula.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - name: Read sha256 files from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p sha
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.sha256' \
            --dir sha
          extract() {
            awk '{print $1}' "sha/treeman-${VERSION}-$1.tar.gz.sha256"
          }
          {
            echo "VERSION=${VERSION}"
            echo "SHA_DARWIN_ARM64=$(extract darwin-arm64)"
            echo "SHA_DARWIN_AMD64=$(extract darwin-amd64)"
            echo "SHA_LINUX_ARM64=$(extract linux-arm64)"
            echo "SHA_LINUX_AMD64=$(extract linux-amd64)"
          } >> "$GITHUB_ENV"

      - name: Check out homebrew tap
        uses: actions/checkout@v6
        with:
          repository: stubbedev/homebrew-treeman
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Regenerate formula
        run: |
          set -euo pipefail
          cat > tap/Formula/treeman.rb <<EOF
          class Treeman < Formula
            desc "Per-worktree development environment helper (DBs, hooks, test clones)"
            homepage "https://github.com/stubbedev/treeman"
            version "${VERSION}"
            license "Apache-2.0 OR MIT"

            on_macos do
              on_arm do
                url "https://github.com/stubbedev/treeman/releases/download/v#{version}/treeman-#{version}-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/stubbedev/treeman/releases/download/v#{version}/treeman-#{version}-darwin-amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/stubbedev/treeman/releases/download/v#{version}/treeman-#{version}-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/stubbedev/treeman/releases/download/v#{version}/treeman-#{version}-linux-amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              bin.install "treeman", "treemand"
            end

            # Lets users run \`brew services start treeman\` to keep
            # treemand running across reboots without invoking
            # \`treeman daemon install\` manually. The two installers
            # are mutually exclusive — both bind the same SOCK_STREAM
            # at \$XDG_RUNTIME_DIR/treeman.sock — so the caveats
            # below ask users to pick one.
            service do
              run [opt_bin/"treemand"]
              # KeepAlive only on unexpected exits — \`brew services
              # stop\` and \`treeman daemon stop\` (clean exit 0) leave
              # the daemon down. Mirrors the dict the
              # \`treeman daemon install\` LaunchAgent writes so
              # behaviour matches across install paths.
              keep_alive successful_exit: false
              process_type :background
              log_path var/"log/treemand.log"
              error_log_path var/"log/treemand.log"
            end

            def caveats
              <<~CAVEATS
                To start treemand in the background:
                  brew services start treeman

                Or, without homebrew-services:
                  treeman daemon install

                Don't enable both — they bind the same socket.
              CAVEATS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/treeman --version")
            end
          end
          EOF

      - name: Commit and push
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/treeman.rb; then
            echo "Formula already up to date for ${VERSION}; nothing to do."
            exit 0
          fi
          git add Formula/treeman.rb
          git commit -m "treeman ${VERSION}"
          git push
