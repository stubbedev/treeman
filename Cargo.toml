[workspace]
resolver = "3"
members = [
    "crates/treeman-proto",
    "crates/treeman-core",
    "crates/treeman-store",
    "crates/treeman-db",
    "crates/treeman-migrations",
    "crates/treeman-watcher",
    "crates/treeman-snapshot",
    "crates/treeman-prepare",
    "crates/treeman-daemon",
    "crates/treeman-cli",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stubbe/treeman"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }
jsonrpsee = { version = "0.24", features = ["server", "client", "macros"] }
directories = "5"

treeman-proto = { path = "crates/treeman-proto", version = "0.1.2" }
treeman-core = { path = "crates/treeman-core", version = "0.1.2" }
treeman-store = { path = "crates/treeman-store", version = "0.1.2" }
treeman-db = { path = "crates/treeman-db", version = "0.1.2" }
treeman-migrations = { path = "crates/treeman-migrations", version = "0.1.2" }
treeman-watcher = { path = "crates/treeman-watcher", version = "0.1.2" }
treeman-snapshot = { path = "crates/treeman-snapshot", version = "0.1.2" }
treeman-prepare = { path = "crates/treeman-prepare", version = "0.1.2" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
